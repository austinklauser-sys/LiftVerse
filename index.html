<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BulkTrack</title>
<style>
:root{color-scheme:dark;--bg:#09090B;--card:#18181B;--c2:#27272A;--bd:#2f2f36;--tx:#FAFAFA;--mu:#8e8e99;--ac:#3B82F6;--a2:#60A5FA;--a3:#93C5FD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font-family:inherit}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
section{display:none;animation:fi .25s ease}section.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--mu);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--a2)}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:22px 0 10px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.ring{position:relative;width:200px;height:200px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.big{font-size:40px;font-weight:800;line-height:1}
.bar{margin:12px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .tr{height:8px;background:var(--c2);border-radius:6px;overflow:hidden}.bar .fl{height:100%;border-radius:6px;transition:width .5s}
.meal{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.meal:last-child{border:0}
.meal .i{flex:1;min-width:0}.meal b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mac{font-size:12px;color:var(--mu)}.mac i{font-style:normal;font-weight:700}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:0;background:var(--c2);color:var(--tx);font-size:16px}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:700;width:100%;margin-top:4px}
.btn.s{background:var(--c2)}.btn.sm{width:auto;min-height:44px;padding:0 14px;font-size:14px;margin:0}.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:0 12px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{background:#1e2a44;border:1px solid #2d4a85;color:var(--a3);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.stat div{background:var(--c2);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.fab{position:absolute;right:16px;bottom:76px;width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px #0009}
#chat{display:none;flex-direction:column;height:100%}#chat.on{display:flex}#msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.m.u{background:var(--ac);margin-left:auto;border-bottom-right-radius:4px}.m.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.mc{margin-top:10px;background:var(--c2);border-radius:12px;padding:10px;white-space:normal}.mc .r{display:flex;gap:8px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.chips button{flex:none;min-height:40px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 14px;font-size:14px}
.row{display:flex;gap:8px;align-items:flex-end;padding-top:6px}.row textarea{min-height:48px;max-height:110px;padding:12px;resize:none}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:12}
.sheet>div{background:var(--card);width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.dot{display:inline-block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mh b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{font-size:11px;color:var(--mu)}
.cd{aspect-ratio:1;min-height:40px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx);font-size:14px}
.cd.w{background:var(--ac);font-weight:700}.cd.t{border-color:var(--a2)}.cd.s{outline:2px solid var(--a3)}
.pr{display:inline-block;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:10px}
.ex{margin-top:10px}details.card{padding:12px 16px}summary{display:flex;justify-content:space-between;gap:8px;min-height:32px;align-items:center;cursor:pointer}details .mu{padding-top:4px}
#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8}#ov.on{display:flex}
.oh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}.oh input{min-height:44px;flex:1;background:none;border:0;font-weight:700;font-size:18px;padding:0}
#ob{flex:1;overflow-y:auto;padding:12px 16px}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sr{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;margin:6px 0}.sr.h span{font-size:11px;color:var(--mu);text-align:center}
.sr .n{text-align:center;color:var(--mu);font-weight:700}.sr input{text-align:center;min-height:48px;padding:0 4px}
.ck{min-height:48px;border-radius:12px;border:0;background:var(--c2);color:var(--mu);font-size:20px}.sr.dn input{opacity:.6}.sr.dn .ck{background:var(--ac);color:#fff}
.rp{border-top:1px solid var(--bd);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#rtime{font-size:38px;font-weight:800;text-align:center;color:var(--a2);font-variant-numeric:tabular-nums}
.pre{display:flex;gap:6px;overflow-x:auto}.pre button{flex:1;min-width:58px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font-size:14px;font-weight:600}
.lf{margin:4px 0;text-align:left}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;min-height:52px}header b{font-size:18px}header i{color:var(--a2);font-style:normal}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:700;font-size:14px}.seg button.on{background:var(--ac);color:#fff}
.ck2{display:inline-flex;width:28px;height:28px;border-radius:14px;background:var(--ac);align-items:center;justify-content:center;font-size:16px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.xr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);padding:12px 2px;min-height:56px;font-size:16px}.xr b{display:block;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tg{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--c2);color:var(--mu)}.tg.m{background:#14243f;color:var(--a2)}.tg.p{background:var(--ac);color:#fff;font-weight:700}
</style></head><body>
<div id="app">
<header><b>Bulk<i>Track</i></b><button class="ib" data-a="prof" aria-label="Profile and goals"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></header>
<main>
<section id="t-home"></section><section id="t-nutrition"></section><section id="t-workout"></section><section id="t-weigh"></section><section id="t-profile"></section>
<div id="chat"><h1>AI Coach</h1><div class="mu">Describe a meal, snap a photo, or ask about your goals and lifts.</div><div id="msgs"></div><div id="pv"></div><div class="chips" id="chips"></div>
<div class="row"><button class="ib" data-a="cam" aria-label="Add photo">📷</button><input type="file" id="file" accept="image/*" hidden><textarea id="inp" rows="1" placeholder="What did you eat?"></textarea><button class="ib" style="background:var(--ac)" data-a="send" aria-label="Send">➤</button></div></div>
</main>
<button class="fab" data-a="add" id="fab" aria-label="Add meal">+</button>
<nav id="nav"></nav>
<div id="ov"><div class="oh"><button class="ib" data-a="cancelW" aria-label="Discard workout">✕</button><input id="tt" data-k="title" aria-label="Workout name"><span id="el" class="mu"></span><button class="btn sm" data-a="finW">Finish</button></div><div id="ob"></div>
<div class="rp"><div id="rtime">Rest</div><div class="pre"><button data-a="pre" data-id="60">1:00</button><button data-a="pre" data-id="90">1:30</button><button data-a="pre" data-id="120">2:00</button><button data-a="pre" data-id="180">3:00</button></div><div class="pre" style="margin-top:6px"><button data-a="adj" data-id="-15">−15s</button><button data-a="adj" data-id="15">+15s</button><button data-a="skip">Skip</button></div></div></div>
</div>
<script>
const K='bulktrack.v2',$=s=>document.querySelector(s);
const ld=d=>(d||new Date()).toLocaleDateString('en-CA');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const at=(h,m)=>{const d=new Date();d.setHours(h,m,0,0);return d.toISOString()};
const fm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const DBR={
Chest:{Barbell:'Bench Press;Incline Barbell Bench Press;Decline Barbell Bench Press',
 Dumbbell:'Dumbbell Bench Press;Incline Dumbbell Press;Decline Dumbbell Press;Flat Dumbbell Fly;Incline Dumbbell Fly;Decline Dumbbell Fly;Dumbbell Pullover',
 Cable:'High-to-Low Cable Fly~D-Handle;Mid Cable Fly~D-Handle;Low-to-High Cable Fly~D-Handle;Standing Cable Chest Press~D-Handle',
 Machine:'Plate-Loaded Chest Press;Selectorized Chest Press;Incline Machine Chest Press;Pec Deck;Smith Machine Bench Press;Smith Machine Incline Press',
 Bodyweight:'Push-Up;Decline Push-Up;Chest Dip'},
Back:{Barbell:'Deadlift;Barbell Row;Pendlay Row;T-Bar Row;Rack Pull;Barbell Shrug',
 Dumbbell:'One-Arm Dumbbell Row;Chest-Supported Dumbbell Row;Dumbbell Shrug',
 Cable:'Lat Pulldown~Wide Bar;Close-Grip V-Bar Lat Pulldown~V-Bar;Reverse-Grip Lat Pulldown~Straight Bar;Single-Arm Lat Pulldown~D-Handle;Seated Cable Row (V-Bar)~V-Bar;Seated Cable Row (Wide Straight Bar)~Straight Bar;Single-Arm Cable Row~D-Handle;Straight-Arm Pulldown~Straight Bar',
 Machine:'Assisted Pull-Up Machine;Chest-Supported Machine Row;Hammer Strength Row;Smith Machine Row;Machine Lat Pulldown',
 Bodyweight:'Pull-Up;Chin-Up;Inverted Row;Hyperextension'},
Shoulders:{Barbell:'Overhead Press;Push Press;Barbell Upright Row;Barbell Front Raise',
 Dumbbell:'Dumbbell Shoulder Press;Arnold Press;Dumbbell Lateral Raise;Dumbbell Rear-Delt Raise;Dumbbell Front Raise',
 Cable:'Cable Lateral Raise~D-Handle;Face Pull~Rope;Cable Rear-Delt Fly~D-Handle;Cable Front Raise~Rope;Cable Upright Row~Straight Bar',
 Machine:'Selectorized Shoulder Press;Plate-Loaded Shoulder Press;Smith Machine Shoulder Press;Rear Delt Fly Machine;Machine Lateral Raise',
 Bodyweight:'Pike Push-Up'},
Quads:{Barbell:'Squat;Front Squat;Barbell Bulgarian Split Squat;Barbell Walking Lunge',
 Dumbbell:'Goblet Squat;Dumbbell Bulgarian Split Squat;Dumbbell Walking Lunge;Dumbbell Reverse Lunge;Dumbbell Step-Up',
 Machine:'Hack Squat;Pendulum Squat;V-Squat;Leg Press;Single-Leg Press;Smith Machine Squat;Smith Machine Split Squat;Leg Extension;Belt Squat',
 Bodyweight:'Bodyweight Squat;Sissy Squat;Wall Sit'},
'Hamstrings/Glutes':{Barbell:'Romanian Deadlift;Stiff-Leg Deadlift;Sumo Deadlift;Barbell Hip Thrust;Good Morning',
 Dumbbell:'Dumbbell Romanian Deadlift;Single-Leg Dumbbell RDL;Dumbbell Hip Thrust;Dumbbell Sumo Squat',
 Cable:'Cable Pull-Through~Rope;Cable Glute Kickback~Ankle Strap;Cable Hip Abduction~Ankle Strap;Cable Hamstring Curl~Ankle Strap',
 Machine:'Seated Leg Curl;Lying Leg Curl;Standing Leg Curl;Hip Abductor Machine;Hip Adductor Machine;Hip Thrust Machine;Glute Kickback Machine;Smith Machine Hip Thrust;Smith Machine Romanian Deadlift',
 Bodyweight:'Glute Bridge;Nordic Hamstring Curl'},
Biceps:{Barbell:'Barbell Curl;EZ-Bar Curl~EZ-Bar;EZ-Bar Preacher Curl~EZ-Bar;Reverse Barbell Curl;Drag Curl',
 Dumbbell:'Dumbbell Curl;Hammer Curl;Incline Dumbbell Curl;Spider Curl;Concentration Curl;Dumbbell Preacher Curl;Zottman Curl',
 Cable:'Single-Arm Cable Curl~D-Handle;Rope Hammer Curl~Rope;Cable Bar Curl~Straight Bar;Overhead Cable Curl~D-Handle',
 Machine:'Preacher Curl Machine;Selectorized Bicep Curl Machine'},
Triceps:{Barbell:'Skullcrusher~EZ-Bar;Close-Grip Bench Press;EZ-Bar Overhead Extension~EZ-Bar',
 Dumbbell:'Dumbbell Skullcrusher;Overhead Dumbbell Extension;Dumbbell Kickback',
 Cable:'Rope Tricep Pushdown~Rope;Straight Bar Tricep Pushdown~Straight Bar;V-Bar Tricep Pushdown~V-Bar;Overhead Cable Extension (Rope)~Rope;Single-Arm Cable Pushdown~D-Handle;Reverse-Grip Pushdown~Straight Bar',
 Machine:'Tricep Extension Machine;Tricep Dip Machine;Assisted Dip Machine;Smith Machine Close-Grip Bench',
 Bodyweight:'Tricep Dip;Bench Dip;Close-Grip Push-Up'},
Calves:{Barbell:'Barbell Standing Calf Raise',Dumbbell:'Single-Leg Dumbbell Calf Raise',
 Machine:'Standing Calf Raise;Seated Calf Raise;Leg Press Calf Raise;Smith Machine Calf Raise',Bodyweight:'Bodyweight Calf Raise'},
Core:{Barbell:'Landmine Rotation',Dumbbell:'Dumbbell Side Bend;Weighted Decline Sit-Up',
 Cable:'Cable Crunch~Rope;Cable Woodchop~D-Handle;Pallof Press~D-Handle',Machine:'Ab Crunch Machine;Rotary Torso Machine',
 Bodyweight:'Hanging Leg Raise;Hanging Knee Raise;Plank;Side Plank;Ab Wheel Rollout;Russian Twist;Sit-Up;Decline Sit-Up;Dead Bug;Bicycle Crunch'}};
const DB=[];for(const m in DBR)for(const e in DBR[m])DBR[m][e].split(';').forEach(s=>{const[n,a]=s.split('~');DB.push({n,m,e,a:a||''})});
const PG={Chest:'Chest',Back:'Back',Shoulders:'Shoulders',Quads:'Legs','Hamstrings/Glutes':'Legs',Calves:'Legs',Biceps:'Arms',Triceps:'Arms',Core:'Core'};
function prCheck(P,n,w,r,date){const e=w*(1+r/30),p=P[n]||(P[n]={w:0,e:0,h:[]}),first=p.w===0;let t=null;if(w>p.w)t='Weight PR';else if(e>p.e+.01)t='Est. 1RM PR';
 if(w>p.w)p.w=w;if(e>p.e)p.e=e;if(t){p.h.push({d:date,w,r,e:Math.round(e),t});p.h=p.h.slice(-12)}return first?null:t}
function seedW(){const W=[146.4,147,147.8,148.3,148.9,149.3,149.8,150.1],B=[15.2,15.1,15,15.1,14.9,14.8,14.9,14.8],O=[35,28,21,14,10,7,4,1];
 return O.map((o,i)=>{const d=new Date();d.setDate(d.getDate()-o);const w=W[i];return{id:uid(),date:ld(d),w,bf:B[i],bmi:+(703*w/4624).toFixed(1),mus:+(w*(1-B[i]/100)*.5).toFixed(1),wat:+(58+i*.1).toFixed(1),vis:4,bmr:1640+i*6}})}
function seed(){const t=new Date();t.setDate(t.getDate()+90);
 const TP=[['Push Day',[['Bench Press',155,5],['Incline Dumbbell Press',60,8],['Overhead Press',95,6]]],['Pull Day',[['Deadlift',275,5],['Barbell Row',155,8],['Lat Pulldown',120,10]]],['Leg Day',[['Squat',225,5],['Romanian Deadlift',185,8],['Leg Press',360,10]]]];
 const offs=[38,36,34,31,29,27,24,22,20,18,16,13,11,9,7,5,3,1],ws=offs.map((o,i)=>{const d=new Date();d.setDate(d.getDate()-o);const T=TP[i%3];
  return{id:uid(),date:ld(d),title:T[0],dur:50+(i%4)*5,exs:T[1].map(([n,w,r])=>{const x=Math.floor(i/3)*(w>=200?10:w>=100?5:2.5);return{name:n,sets:[{w:w+x,r},{w:w+x,r},{w:w+x-(w>=100?10:5),r:r+1}]}})}});
 const P={};ws.forEach(w=>w.exs.forEach(x=>x.sets.forEach(s=>prCheck(P,x.name,s.w,s.r,w.date))));
 return{profile:{w:150,h:68,age:24,sex:'male',act:1.55,tw:165,td:ld(t),mode:'bulk'},
 log:[{id:uid(),name:'Oatmeal, banana & whey',ts:at(8,5),cal:610,p:38,c:82,f:14},{id:uid(),name:'Turkey & cheese sandwich',ts:at(12,30),cal:640,p:42,c:68,f:22},{id:uid(),name:'Post-workout protein shake',ts:at(15,15),cal:330,p:30,c:35,f:8}],
 saved:[{id:uid(),name:'Chicken & rice bowl',cal:720,p:52,c:85,f:16},{id:uid(),name:'Mass gainer shake',cal:650,p:45,c:80,f:15},{id:uid(),name:'PB&J sandwich + whole milk',cal:520,p:22,c:62,f:20},{id:uid(),name:'Greek yogurt + granola',cal:380,p:24,c:45,f:10}],
 workouts:ws,prs:P,act:null,weigh:seedW(),chat:[{r:'a',t:'Hey! I’m your AI coach 💪 Tell me what you ate, snap your plate, or ask about your lifts and calories.'}]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.profile)S=seed();
if(!S.weigh)S.weigh=seedW();if(!S.profile.mode)S.profile.mode='bulk';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S,(k,v)=>k==='img'?undefined:v))}catch(e){}};
S.chat=S.chat.slice(-40);

const MODES={bulk:'Bulk',cut:'Cut',maintain:'Maintain'};
function calc(p){const m=p.mode||'bulk',kg=p.w*.45359,cm=p.h*2.54,bmr=10*kg+6.25*cm-5*p.age+(p.sex==='male'?5:-161),tdee=bmr*p.act,days=Math.max(1,Math.ceil((new Date(p.td+'T00:00')-new Date())/864e5)),warns=[];let adj=0;
 if(m==='bulk'){const gain=p.tw-p.w,raw=gain>0?gain*3500/days:250;adj=Math.min(raw,1000);
  if(gain<=0)warns.push('Target weight is at or below your current weight, so I’m using a small 250 kcal lean-gain surplus.');
  if(raw>1000)warns.push(`Reaching ${p.tw} lb by that date would need about +${Math.round(raw)} kcal/day, which is too aggressive and mostly adds fat. Surplus is capped at +1,000; at that pace you’d get there in about ${Math.ceil(gain*500/1000)} weeks.`);
  else if(raw>700)warns.push('This is an aggressive surplus. Expect some extra fat gain; consider a later date.')}
 if(m==='cut'){const loss=p.w-p.tw,raw=loss>0?loss*3500/days:400,cap=Math.min(1000,tdee*.25),fl=p.sex==='male'?1500:1200;adj=-Math.min(raw,cap);
  if(loss<=0)warns.push('Target weight is at or above your current weight, so I’m using a moderate 400 kcal deficit.');
  else if(raw>cap)warns.push(`Losing ${loss} lb by that date would need about −${Math.round(raw)} kcal/day, which is too aggressive and risks muscle loss. Deficit is capped at −${Math.round(cap)}; at that pace you’d get there in about ${Math.ceil(loss*3500/cap/7)} weeks.`);
  else if(raw>tdee*.2)warns.push('This is an aggressive deficit. Keep protein high and consider a later date.');
  if(tdee+adj<fl){adj=Math.min(0,fl-tdee);warns.push(`Calories are held at a ${fl} kcal safety floor.`)}}
 const cal=Math.round(tdee+adj),P=Math.round(p.w*{bulk:1,cut:1.15,maintain:.9}[m]),F=Math.round(cal*{bulk:.25,cut:.25,maintain:.28}[m]/9),C=Math.max(0,Math.round((cal-P*4-F*9)/4));
 return{mode:m,tdee:Math.round(tdee),sur:Math.round(adj),cal,p:P,c:C,f:F,wk:(adj*7/3500).toFixed(2),warns}}
const G=()=>calc(S.profile);
const todays=()=>S.log.filter(m=>ld(new Date(m.ts))===ld()).sort((a,b)=>a.ts<b.ts?-1:1);
const tot=()=>todays().reduce((a,m)=>({cal:a.cal+m.cal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{cal:0,p:0,c:0,f:0});
const mac=m=>`<span class="mac"><i style="color:var(--a2)">${m.p}P</i> · <i style="color:var(--ac)">${m.c}C</i> · <i style="color:var(--a3)">${m.f}F</i></span>`;

 add(){sheet('Add meal',{},m=>{S.log.push({id:uid(),ts:new Date().toISOString(),...m});upd()})},
 edit(id){const e=S.log.find(m=>m.id===id);sheet('Edit meal',e,m=>{Object.assign(e,m);upd()})},
 del(id){S.log=S.log.filter(m=>m.id!==id);upd()},
 star(id){const{name,cal,p,c,f}=S.log.find(m=>m.id===id);S.saved.push({id:uid(),name,cal,p,c,f});upd();toast('Saved to Saved Meals')},
 log1(id){const{name,cal,p,c,f}=S.saved.find(m=>m.id===id);S.log.push({id:uid(),ts:new Date().toISOString(),name,cal,p,c,f});upd();toast('Logged: '+name)},
 newS(){sheet('New saved meal',{},m=>{S.saved.push({id:uid(),...m});upd()})},
 editS(id){const e=S.saved.find(m=>m.id===id);sheet('Edit saved meal',e,m=>{Object.assign(e,m);upd()})},
 delS(id){S.saved=S.saved.filter(m=>m.id!==id);upd()},
 reset(i,b){if(b.dataset.c){S=seed();upd();rProfile();rWork();rWeigh();return}b.dataset.c=1;b.textContent='Tap again to confirm reset'},
 cam(){$('#file').click()},send(){send()},
 go(id){tab(id)},prof(){tab('profile')},home(){tab('home')},nv(id){nv=id;rNut()},
 mode(id){S.profile.mode=id;save();rProfile();rNut();rHome()},
 logW(){const v=i=>{const x=parseFloat($('#'+i).value);return x>0?x:null},w=v('wiw');if(!w){toast('Enter your weight');return}
  const e={id:uid(),date:ld(),w,bf:v('wibf'),bmi:v('wibmi')||+(703*w/(S.profile.h**2)).toFixed(1),mus:v('wimu'),wat:v('wiwa'),vis:v('wivi'),bmr:v('wibr')};
  S.weigh=S.weigh.filter(x=>x.date!==e.date);S.weigh.push(e);S.weigh.sort((a,b)=>a.date<b.date?-1:1);S.profile.w=S.weigh[S.weigh.length-1].w;
  save();rWeigh();rHome();rNut();toast('Weigh-in saved')},
 delW(id){S.weigh=S.weigh.filter(x=>x.id!==id);save();rWeigh();rHome()},
 clog(i){const m=S.chat[+i];if(m.done)return;S.log.push({id:uid(),ts:new Date().toISOString(),...m.meal});m.done=1;upd();rChat()},
 csave(i){const m=S.chat[+i];S.saved.push({id:uid(),...m.meal});m.saved=1;upd();rChat()},
 chip(i,b){$('#inp').value=b.textContent;send()},
 day(id){sel=id;rWork()},mon(id){cm.setMonth(cm.getMonth()+ +id);rWork()},
 startW(){if(!S.act)S.act={start:Date.now(),title:'Workout',exs:[]};save();openW()},
 addEx(){picker(addExercise)},lib(){picker(showPR)},
 addSet(i,b){const x=S.act.exs[+b.dataset.e],l=x.sets[x.sets.length-1]||{};x.sets.push({w:l.w??'',r:l.r??'',done:0});save();rOb()},
 rmEx(i,b){S.act.exs.splice(+b.dataset.e,1);save();rOb()},
 chk(i,b){const x=S.act.exs[+b.dataset.e],s=x.sets[+b.dataset.s];s.done=!s.done;
  if(s.done){if(+s.w>0&&+s.r>0){const t=prCheck(S.prs,x.name,+s.w,+s.r,ld());if(t){s.pr=t;toast('NEW PR! '+x.name)}}restStart(rest.last)}save();rOb()},
 pre(id){restStart(+id)},skip(){rest.end=0;$('#rtime').textContent='Rest'},
 adj(id){const d=+id;if(rest.end)rest.end+=d*1e3;else{rest.dur=Math.max(15,rest.dur+d);rest.last=rest.dur;$('#rtime').textContent=fm(rest.dur)}},
 finW(){const a=S.act,exs=a.exs.map(x=>({name:x.name,sets:x.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0,...(s.pr?{pr:s.pr}:{})}))})).filter(x=>x.sets.length);
  if(exs.length)S.workouts.push({id:uid(),date:ld(),title:a.title||'Workout',dur:Math.max(1,Math.round((Date.now()-a.start)/6e4)),exs});
  S.act=null;rest.end=0;$('#rtime').textContent='Rest';$('#ov').classList.remove('on');sel=ld();cm=new Date();cm.setDate(1);save();rWork();rHome();toast(exs.length?'Workout saved':'No sets completed')},
 cancelW(i,b){if(b.dataset.c){S.act=null;rest.end=0;$('#ov').classList.remove('on');save();rWork();rHome();return}b.dataset.c=1;b.textContent='?';setTimeout(()=>{b.dataset.c='';b.textContent='✕'},2500);toast('Tap again to discard workout')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.id,b)});
function upd(){save();rNut();rHome()}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;z-index:30;white-space:nowrap';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}

const T=[['home','Home','<path d="M4 11l8-7 8 7v9H4z"/>'],['nutrition','Nutrition','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['workout','Workout','<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'],['weigh','Weigh-In','<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0M12 10l1.8-2"/>'],['chat','AI Coach','<path d="M4 5h16v11H9l-5 4z"/>']];
$('#nav').innerHTML=T.map(t=>`<button data-t="${t[0]}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join('');
function tab(n){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
 document.querySelectorAll('main>section,#chat').forEach(s=>s.classList.toggle('on',s.id==='t-'+n||s.id===n));
 $('#fab').style.display='none';$('main').style.overflowY=n==='chat'?'hidden':'auto';$('main').scrollTop=0;
 if(n==='chat')rChat();if(n==='home')rHome();if(n==='weigh')rWeigh();if(n==='profile')rProfile();if(n==='workout')rWork();if(n==='nutrition')rNut()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab(b.dataset.t);try{history.replaceState(null,'','#'+b.dataset.t)}catch(x){}}};
$('#t-profile').addEventListener('input',e=>{const p=S.profile,i=e.target;if(!i.id)return;p[i.id]=['sex','td'].includes(i.id)?i.value:(+i.value||0);save();rRes();rNut();rHome()});

/* ---------- AI coach ---------- */
let pend=null,busy=false;
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function parse(t){const i=t.indexOf('MEAL_JSON');if(i<0)return{text:t.trim()};let meal=null;try{const j=t.slice(i).match(/\{[^}]*\}/);if(j){const o=JSON.parse(j[0]);meal={name:String(o.name||'Meal'),cal:Math.round(o.cal),p:Math.round(o.p),c:Math.round(o.c),f:Math.round(o.f)};if([meal.cal,meal.p,meal.c,meal.f].some(isNaN))meal=null}}catch(e){}return{text:t.slice(0,i).trim(),meal}}
function rChat(){$('#msgs').innerHTML=S.chat.map((m,i)=>`<div class="m ${m.r}">${m.img?`<img src="${m.img}" alt="Meal photo">`:''}${m.wait&&!m.t?'<span class="dot">●●●</span>':fmt(m.t)}${m.meal?`<div class="mc"><b>${esc(m.meal.name)}</b><br><span class="mac">${m.meal.cal} kcal</span> · ${mac(m.meal)}<div class="r"><button class="btn sm" data-a="clog" data-id="${i}"${m.done?' disabled':''}>${m.done?'Logged ✓':'Log Meal'}</button><button class="btn sm s" data-a="csave" data-id="${i}"${m.saved?' disabled':''}>${m.saved?'Saved ✓':'★ Save'}</button></div></div>`:''}</div>`).join('');
 const r=G(),t=tot();$('#chips').innerHTML=[`I’m ${Math.max(0,r.cal-t.cal)} calories short, what should I eat?`,'2 cups pasta with chicken and a glass of whole milk',r.mode==='cut'?'How do I keep my strength while cutting?':r.mode==='maintain'?'How do I stay consistent at maintenance?':'How should I progress my bench press?'].map(x=>`<button data-a="chip">${esc(x)}</button>`).join('');
 $('#pv').innerHTML=pend?`<div class="mu" style="padding:6px 0"><img src="${pend.url}" alt="" style="height:44px;border-radius:8px;vertical-align:middle"> Photo attached <button class="ib" id="rm" aria-label="Remove">✕</button></div>`:'';
 const rm=$('#rm');if(rm)rm.onclick=()=>{pend=null;rChat()};$('#msgs').scrollTop=1e9}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{pend={blob:b,url:c.toDataURL('image/jpeg',.5)};rChat()},'image/jpeg',.85)};i.src=URL.createObjectURL(f);e.target.value=''};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function send(){if(busy)return;const inp=$('#inp');let text=inp.value.trim();if(!text&&!pend)return;if(!text)text='Estimate the calories and macros of this meal.';
 const img=pend;pend=null;inp.value='';S.chat.push({r:'u',t:text,img:img&&img.url});const a={r:'a',t:'',wait:1};S.chat.push(a);busy=true;rChat();
 try{const sample=await window.claude?.use('sample');if(!sample)throw{message:'AI is only available when this app is opened in Claude.'};
  const g=G(),t=tot(),wi=S.weigh.slice(-4).map(x=>x.w+' lb'+(x.bf?' ('+x.bf+'% BF)':'')).join(' → '),pr=Object.entries(S.prs).sort((x,y)=>y[1].e-x[1].e).slice(0,6).map(([n,p])=>`${n} ${p.w} lb (est. 1RM ${Math.round(p.e)})`).join('; '),lw=S.workouts[S.workouts.length-1],c14=ld(new Date(Date.now()-14*864e5));
  const ctx=`You are an upbeat, knowledgeable personal trainer and nutrition coach inside a mobile tracker. Keep replies under 120 words, plain text (** bold ok, no headers). Be encouraging and specific. Daily goal: ${g.cal} kcal, ${g.p}g protein, ${g.c}g carbs, ${g.f}g fat. Eaten today: ${t.cal} kcal, ${t.p}P/${t.c}C/${t.f}F. Remaining: ${g.cal-t.cal} kcal, ${g.p-t.p}g P, ${g.c-t.c}g C, ${g.f-t.f}g F. Phase: ${MODES[g.mode].toUpperCase()} (${g.sur>0?'+':''}${g.sur} kcal/day vs ${g.tdee} maintenance); tailor all advice to this phase (bulk: fuel growth and progressive overload; cut: preserve muscle, high protein, satiety, sustainable deficit; maintain: consistency and recomp). User: ${S.profile.w} lb, target ${S.profile.tw} lb by ${S.profile.td}. Recent weigh-ins: ${wi}. Training: ${S.workouts.filter(w=>w.date>=c14).length} workouts in last 14 days; last was ${lw?lw.title+' on '+lw.date:'none'}. Best lifts: ${pr}. When the user describes or shows food they ate (or you recommend a specific meal/snack), give realistic estimates and end with one final line exactly like: MEAL_JSON: {"name":"short meal name","cal":0,"p":0,"c":0,"f":0} using integers. Omit that line for advice with no specific meal.\n\nUser message: `;
  let hist=S.chat.slice(0,-2).filter(m=>m.t&&!m.wait).slice(-8).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));while(hist.length&&hist[0].role!=='user')hist.shift();
  const o={cache:false,onText:({text})=>{a.t=parse(text).text;rChat()}};
  if(img){const l=await sample.limits();if(l&&l.images)o.images=[img.blob]}
  const r=await sample([...hist,{role:'user',content:ctx+text}],o),p=parse(r.text);a.t=p.text||'Done!';a.meal=p.meal}
 catch(e){a.t=e.code==='not_granted'?'AI access was declined. Allow it to chat with your coach.':e.code==='rate_limited'?'Too many requests, try again in a moment.':'Coach error: '+(e.message||'try again')}
 delete a.wait;busy=false;save();rChat()}

upd();rWork();rWeigh();const h=location.hash.slice(1);tab(T.some(t=>t[0]===h)?h:'home');if(S.act)openW();
</script></body></html>
