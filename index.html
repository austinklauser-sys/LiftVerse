<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftVerse">
<link id="pwa-icon" rel="apple-touch-icon">
<link id="pwa-manifest" rel="manifest">
<title>LiftVerse</title>
<style>
:root{color-scheme:dark;--bg:#09090B;--card:#18181B;--c2:#27272A;--bd:#2f2f36;--tx:#FAFAFA;--mu:#8e8e99;--ac:#3B82F6;--a2:#60A5FA;--a3:#93C5FD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font-family:inherit}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
#app.has-mini main{padding-bottom:88px}
section{display:none;animation:fi .25s ease}section.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.55}}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);position:relative;z-index:5}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--mu);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--a2)}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:22px 0 10px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.ring{position:relative;width:200px;height:200px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.big{font-size:40px;font-weight:800;line-height:1}
.bar{margin:12px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .tr{height:8px;background:var(--c2);border-radius:6px;overflow:hidden}.bar .fl{height:100%;border-radius:6px;transition:width .5s}
.meal{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.meal:last-child{border:0}
.meal .i{flex:1;min-width:0}.meal b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mac{font-size:12px;color:var(--mu)}.mac i{font-style:normal;font-weight:700}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:0;background:var(--c2);color:var(--tx);font-size:16px}
.ib.on{background:#14243f;border:1px solid var(--ac);color:var(--a2)}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:700;width:100%;margin-top:4px}
.btn.s{background:var(--c2)}.btn.sm{width:auto;min-height:42px;padding:0 13px;font-size:13.5px;margin:0}.btn:disabled{opacity:.5}
.btn.dng{background:#3a181d;color:#fca5a5;border:1px solid #6b2630}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:0 12px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{background:#1e2a44;border:1px solid #2d4a85;color:var(--a3);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.stat div{background:var(--c2);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.fab{position:absolute;right:16px;bottom:76px;width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px #0009;z-index:4;transition:bottom .2s}
#app.has-mini .fab{bottom:144px}
#chat{display:none;flex-direction:column;height:100%}#chat.on{display:flex}#msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.m.u{background:var(--ac);margin-left:auto;border-bottom-right-radius:4px}.m.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.mc{margin-top:10px;background:var(--c2);border-radius:12px;padding:10px;white-space:normal}.mc .r{display:flex;gap:8px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.chips button{flex:none;min-height:40px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 14px;font-size:14px}
.row{display:flex;gap:8px;align-items:flex-end;padding-top:6px}.row textarea{min-height:48px;max-height:110px;padding:12px;resize:none}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:12}
.sheet>div{background:var(--card);width:100%;max-width:430px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.dot{display:inline-block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.mh b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{font-size:11px;color:var(--mu)}
.cd{aspect-ratio:1;min-height:40px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx);font-size:14px}
.cd.w{background:var(--ac);font-weight:700}.cd.t{border-color:var(--a2)}.cd.s{outline:2px solid var(--a3)}
.pr{display:inline-block;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:10px}
.streak-pill{display:inline-flex;align-items:center;gap:5px;background:#14243f;border:1px solid #2d4a85;color:var(--a2);font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
.ex{margin-top:10px}details.card{padding:12px 16px}summary{display:flex;justify-content:space-between;gap:8px;min-height:32px;align-items:center;cursor:pointer}details .mu{padding-top:4px}
#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8}#ov.on{display:flex}
.oh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--card)}.oh input{min-height:44px;flex:1;background:none;border:0;font-weight:700;font-size:16px;padding:0 4px;min-width:0}
.wclock{background:#14243f;border:1px solid #2d4a85;color:var(--a2);font-weight:800;font-size:13px;padding:6px 8px;border-radius:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
#ob{flex:1;overflow-y:auto;padding:12px 16px}
.eh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.last-ref{display:inline-block;font-size:11.5px;color:var(--a3);background:#14243f;border:1px solid #243b66;padding:2px 8px;border-radius:8px;margin-top:3px}
.sr{display:grid;grid-template-columns:90px 1fr 1fr 50px;gap:8px;align-items:center;margin:6px 0;padding:4px;border-radius:10px;transition:all .2s}
.sr.active-set{background:#14243f;border:1.5px solid var(--ac);box-shadow:0 0 10px rgba(59,130,246,.25)}
.sr.h span{font-size:11px;color:var(--mu);text-align:center}
.sr input{text-align:center;min-height:48px;padding:0 4px}
.st-sel{min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font-weight:800;font-size:12px;padding:0 6px;cursor:pointer}
.st-sel.warmup{background:#332611;border-color:#78531a;color:#fbbf24}
.st-sel.drop{background:#29193d;border-color:#5b328a;color:#c084fc}
.st-tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:6px;margin-right:3px}
.st-tag.warmup{background:#332611;color:#fbbf24}
.st-tag.drop{background:#29193d;color:#c084fc}
.ck{min-height:48px;border-radius:12px;border:0;background:var(--c2);color:var(--mu);font-size:20px}
.sr.dn input{opacity:.6}
.sr.dn .ck{background:#10B981;color:#fff}
@keyframes flashGreen{0%{background:rgba(16,185,129,0.35);border-color:#10B981}100%{background:transparent;border-color:transparent}}
.flash-green{animation:flashGreen .65s ease}
.superset-box{border-left:3px solid var(--ac);background:linear-gradient(90deg,rgba(59,130,246,0.06),transparent);padding-left:10px;margin-bottom:14px}
.rp{border-top:1px solid var(--bd);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#rtime{font-size:36px;font-weight:800;text-align:center;color:var(--a2);font-variant-numeric:tabular-nums;line-height:1.1}
#rtime.over{color:#ef4444;animation:pulseRed 1s infinite}
.pre{display:flex;gap:6px;overflow-x:auto}.pre button{flex:1;min-width:58px;min-height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font-size:13px;font-weight:600}
.pre button.on{background:#14243f;border-color:var(--ac);color:var(--a2)}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;min-height:52px}header b{font-size:18px}header i{color:var(--a2);font-style:normal}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:700;font-size:13px}.seg button.on{background:var(--ac);color:#fff}
.ck2{display:inline-flex;width:28px;height:28px;border-radius:14px;background:var(--ac);align-items:center;justify-content:center;font-size:16px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.xr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);padding:10px 2px;min-height:72px;font-size:16px}.xr b{display:block;font-weight:600}.xr .xi{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tg{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--c2);color:var(--mu)}.tg.m{background:#14243f;color:var(--a2)}.tg.p{background:var(--ac);color:#fff;font-weight:700}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.rec-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.rec-ring{position:relative;width:78px;height:78px;margin:4px 0 6px}.rec-ring svg{transform:rotate(-90deg)}
.rec-ring .rmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.rec-sub{font-size:11.5px;margin-top:2px;line-height:1.25}
.rec-ready{color:var(--a2);font-weight:600}
.mmap-box{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:8px 0}
.mmap-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:11.5px;color:var(--mu);margin-top:6px}
.mmap-leg span{display:inline-flex;align-items:center;gap:5px}
.mmap-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.demo-thumb{width:56px;height:56px;border-radius:12px;background:#121215;border:1px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.demo-card{background:#121215;border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:12px}
.demo-card .demo-vis{width:104px;height:104px;border-radius:12px;background:#09090B;border:1px solid #26262c;flex:none;display:flex;align-items:center;justify-content:center}
.demo-card .demo-txt{flex:1;min-width:0}
.demo-card .demo-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--a2);margin-bottom:3px}
.demo-card .demo-cue{font-size:13px;color:var(--tx);line-height:1.35}
#minibar{display:none;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#122038,#18181B);border-top:1px solid #2d4a85;padding:10px 14px;cursor:pointer;z-index:6}
#minibar.on{display:flex}
.mb-left{min-width:0;flex:1}
.mb-title{font-size:13.5px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.mb-dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;box-shadow:0 0 8px var(--ac)}
.mb-sub{font-size:12px;color:var(--a2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-right{display:flex;align-items:center;gap:8px;flex:none}
.mb-pill{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums}
.mb-pill span{display:block;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.mb-pill b{font-size:13px;color:var(--tx)}
.mb-pill.rest b{color:var(--a2)}
.mb-pill.rest.over{border-color:#7f1d1d;background:#2b1114}
.mb-pill.rest.over b{color:#ef4444;animation:pulseRed 1s infinite}
.ach-group{margin-bottom:14px}
.ach-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ach-badge{flex:1;min-width:64px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;opacity:.45;transition:all .3s}
.ach-badge.unlocked{opacity:1;background:linear-gradient(180deg,#162b4d,#121d33);border-color:var(--ac);box-shadow:0 0 14px rgba(59,130,246,.28)}
.ach-badge .aw{font-size:14px;font-weight:800;color:var(--tx)}
.ach-badge.unlocked .aw{color:var(--a2)}
.ach-badge .al{font-size:10px;color:var(--mu);margin-top:2px}
.ach-badge.unlocked .al{color:var(--a3)}
.pct-tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.pct-tbl th{text-align:left;color:var(--mu);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--bd)}
.pct-tbl td{padding:8px;border-bottom:1px solid var(--bd)}
.pct-tbl tr:last-child td{border:0}
.pct-tbl td:nth-child(2){font-weight:800;color:var(--a2)}
.pct-tbl td:last-child{text-align:right;color:var(--mu)}
.plates-row{display:flex;align-items:center;justify-content:center;gap:5px;min-height:76px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.bar-sleeve{width:26px;height:12px;background:#52525b;border-radius:3px}
.plate-pill{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:800;color:#fff;width:24px;box-shadow:0 2px 6px #0008}
.p-45{height:66px;background:#2563EB;border:1px solid #60A5FA}
.p-35{height:58px;background:#0284C7;border:1px solid #38BDF8}
.p-25{height:50px;background:#059669;border:1px solid #34D399}
.p-10{height:40px;background:#52525b;border:1px solid #a1a1aa}
.p-5{height:32px;background:#3f3f46;border:1px solid #71717a;font-size:10px}
.p-2_5{height:26px;background:#27272a;border:1px solid #52525b;font-size:9px;width:26px}
.adapt-card{background:linear-gradient(135deg,#13233d,#18181B);border:1px solid #2d4a85;border-radius:16px;padding:14px;margin-bottom:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:#064e3b;border:1px solid #059669;color:#6ee7b7;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app">
<header><b>Lift<i>Verse</i></b><button class="ib" data-a="prof" aria-label="Profile and goals"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button></header>
<main>
<section id="t-home"></section><section id="t-nutrition"></section><section id="t-workout"></section><section id="t-weigh"></section><section id="t-profile"></section>
<div id="chat">
  <div class="mh" style="margin-bottom:2px">
    <h1 style="margin:0">Llama Local Coach</h1>
    <span class="ai-badge">● 100% On-Device</span>
  </div>
  <div class="mu">Trained on your routines, weigh-ins, macros, and PRs. Describe any meal, scan a barcode, or ask a question!</div>
  <div id="msgs"></div>
  <div id="pv"></div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <button class="ib" data-a="scanBarcode" title="Scan barcode on food box">🏷️</button>
    <button class="ib" data-a="cam" aria-label="Add meal photo" title="Scan meal photo">📷</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="inp" rows="1" placeholder="Ask about your lifts, macros, or type what you ate..."></textarea>
    <button class="ib" style="background:var(--ac)" data-a="send" aria-label="Send">➤</button>
  </div>
</div>
</main>
<button class="fab" data-a="add" id="fab" aria-label="Add meal">+</button>
<div id="minibar" data-a="resumeW" role="button" tabindex="0" aria-label="Expand active workout">
  <div class="mb-left">
    <div class="mb-title"><span class="mb-dot"></span><span id="mb-ex">Active Workout</span></div>
    <div class="mb-sub" id="mb-set">Tap to resume session</div>
  </div>
  <div class="mb-right">
    <div class="mb-pill rest" id="mb-rest-box"><span>Rest</span><b id="mb-rest">0:00</b></div>
    <div class="mb-pill"><span>Time</span><b id="mb-time">00:00</b></div>
  </div>
</div>
<nav id="nav"></nav>
<div id="ov">
  <div class="oh">
    <button class="ib" data-a="minW" aria-label="Minimize workout" title="Minimize to mini-bar">⌄</button>
    <input id="tt" data-k="title" aria-label="Workout name">
    <span id="el" class="wclock">00:00</span>
    <button class="ib dng" style="font-size:12px;font-weight:700;padding:0 8px" data-a="cancelW" aria-label="Discard workout">Discard</button>
    <button class="btn sm" data-a="finW">Finish</button>
  </div>
  <div id="ob"></div>
  <div class="rp">
    <div class="rtop">
      <span class="mu" style="font-weight:600">Rest Stopwatch</span>
      <span class="mu" id="rgoal">Target: 2:00</span>
    </div>
    <div id="rtime">0:00</div>
    <div class="pre" id="rpresets" style="margin-top:6px">
      <button data-a="pre" data-id="60">1:00</button>
      <button data-a="pre" data-id="90">1:30</button>
      <button data-a="pre" data-id="120" class="on">2:00</button>
      <button data-a="pre" data-id="180">3:00</button>
    </div>
    <div class="pre" style="margin-top:6px">
      <button data-a="adj" data-id="-15">−15s</button>
      <button data-a="adj" data-id="15">+15s</button>
      <button data-a="skip">Reset</button>
    </div>
  </div>
</div>
</div>
<script>
const K='liftverse.v10',$=s=>document.querySelector(s);
const ld=d=>(d||new Date()).toLocaleDateString('en-CA');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fm=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

/* ---------- PWA Manifest, Icon & Offline Service Worker ---------- */

/* ---------- Confetti Celebration Engine ---------- */
let confPieces=[],confAnim=null;
function launchConfetti(){
  const c=$('#confetti'),ctx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const cols=['#3B82F6','#60A5FA','#93C5FD','#FAFAFA','#CBD5E1','#2563EB'];
  for(let i=0;i<110;i++){
    confPieces.push({
      x:c.width/2+(Math.random()-0.5)*140,
      y:c.height*0.45,
      vx:(Math.random()-0.5)*14,
      vy:-Math.random()*14-4,
      w:Math.random()*8+5,
      h:Math.random()*5+3,
      col:cols[i%cols.length],
      rot:Math.random()*360,
      vr:(Math.random()-0.5)*14,
      life:1
    });
  }
  if(confAnim)return;
  function step(){
    ctx.clearRect(0,0,c.width,c.height);
    confPieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.38;p.vx*=0.985;p.rot+=p.vr;p.life-=0.012;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    confPieces=confPieces.filter(p=>p.life>0&&p.y<c.height+30);
    if(confPieces.length)confAnim=requestAnimationFrame(step);
    else{ctx.clearRect(0,0,c.width,c.height);confAnim=null;}
  }
  confAnim=requestAnimationFrame(step);
}

const MUSCLE_NAMES={
  chest:'Chest',front_delts:'Front/Side Delts',rear_delts:'Rear Delts',biceps:'Biceps',triceps:'Triceps',
  forearms:'Forearms',abs:'Abs/Core',lats:'Lats',upper_back:'Upper/Mid Back',lower_back:'Lower Back',
  quads:'Quads',hamstrings:'Hamstrings',glutes:'Glutes',calves:'Calves'
};

function getMuscles(ex){
  const n=(ex.n||'').toLowerCase(),m=ex.m||'';
  if(m==='Chest'){
    if(n.includes('fly')||n.includes('pec deck'))return{pri:['chest'],sec:['front_delts']};
    if(n.includes('pullover'))return{pri:['chest','lats'],sec:['triceps']};
    return{pri:['chest'],sec:['front_delts','triceps']};
  }
  if(m==='Back'){
    if(n.includes('deadlift')||n.includes('rack pull'))return{pri:['lower_back','upper_back','glutes','hamstrings'],sec:['forearms','lats','quads']};
    if(n.includes('hyperextension'))return{pri:['lower_back','glutes'],sec:['hamstrings']};
    if(n.includes('shrug'))return{pri:['upper_back'],sec:['forearms']};
    if(n.includes('pulldown')||n.includes('pull-up')||n.includes('chin-up'))return{pri:['lats'],sec:['upper_back','biceps','forearms']};
    return{pri:['upper_back','lats'],sec:['rear_delts','biceps','forearms']};
  }
  if(m==='Shoulders'){
    if(n.includes('rear')||n.includes('face pull'))return{pri:['rear_delts'],sec:['upper_back']};
    if(n.includes('lateral'))return{pri:['front_delts'],sec:['upper_back']};
    if(n.includes('upright row'))return{pri:['front_delts','upper_back'],sec:['biceps']};
    return{pri:['front_delts'],sec:['triceps','upper_back']};
  }
  if(m==='Quads'){
    if(n.includes('leg extension')||n.includes('sissy'))return{pri:['quads'],sec:[]};
    if(n.includes('lunge')||n.includes('split')||n.includes('step-up'))return{pri:['quads','glutes'],sec:['hamstrings','abs']};
    return{pri:['quads'],sec:['glutes','hamstrings']};
  }
  if(m==='Hamstrings/Glutes'){
    if(n.includes('leg curl')||n.includes('hamstring')||n.includes('nordic'))return{pri:['hamstrings'],sec:['calves']};
    if(n.includes('thrust')||n.includes('bridge')||n.includes('kickback')||n.includes('abduct')||n.includes('adduct'))return{pri:['glutes'],sec:['hamstrings']};
    return{pri:['hamstrings','glutes'],sec:['lower_back','forearms']};
  }
  if(m==='Biceps'){
    if(n.includes('hammer')||n.includes('reverse')||n.includes('zottman'))return{pri:['biceps','forearms'],sec:[]};
    return{pri:['biceps'],sec:['forearms']};
  }
  if(m==='Triceps'){
    if(n.includes('close-grip bench')||n.includes('dip'))return{pri:['triceps'],sec:['chest','front_delts']};
    return{pri:['triceps'],sec:[]};
  }
  if(m==='Calves')return{pri:['calves'],sec:[]};
  if(m==='Core')return{pri:['abs'],sec:['lower_back']};
  return{pri:['chest'],sec:[]};
}

const DB=[];for(const m in DBR)for(const e in DBR[m])DBR[m][e].split(';').forEach(s=>{const[n,a]=s.split('~');const item={n,m,e,a:a||''};const mu=getMuscles(item);item.pri=mu.pri;item.sec=mu.sec;DB.push(item)});
const DB_MAP=Object.fromEntries(DB.map(x=>[x.n,x]));
function lookupEx(name){
  if(DB_MAP[name])return DB_MAP[name];
  const c=(S?.custom||[]).find(x=>x.n===name);
  if(c){const mu=getMuscles(c);return{...c,pri:c.pri||mu.pri,sec:c.sec||mu.sec}}
  return{n:name,m:'Custom',e:'Custom',pri:[],sec:[]};
}

/* ---------- Uniform Custom SVG Exercise Movement Diagram Engine ---------- */
function getMovementGuide(ex){
  const n=(ex.n||'').toLowerCase(),m=ex.m||'';
  if(m==='Chest'){
    if(n.includes('fly')||n.includes('pec deck'))return{pat:'fly',label:'Horizontal Fly Arc',cue:'Keep a soft bend in elbows, stretch wide at the bottom, and squeeze pecs together at the top.'};
    if(n.includes('incline'))return{pat:'incline_press',label:'Incline Press Path',cue:'Set bench to 30–45°, tuck elbows slightly, and press smoothly above upper chest.'};
    if(n.includes('dip')||n.includes('push-up'))return{pat:'pushup',label:'Bodyweight Press Path',cue:'Brace your core, lower chest under full control, and press to full elbow lockout.'};
    return{pat:'bench_press',label:'Flat Press Path',cue:'Retract shoulder blades into the bench, lower bar/weights to mid-chest, and drive straight up.'};
  }
  if(m==='Back'){
    if(n.includes('deadlift')||n.includes('rack pull'))return{pat:'hinge',label:'Hip Hinge & Pull',cue:'Brace lats, keep bar tight against shins, and drive hips forward with a neutral spine.'};
    if(n.includes('pulldown')||n.includes('pull-up')||n.includes('chin-up'))return{pat:'pulldown',label:'Vertical Lat Pull',cue:'Depress shoulders first, drive elbows down toward your ribs, and control the stretch up.'};
    if(n.includes('shrug'))return{pat:'ohp',label:'Scapular Elevation',cue:'Keep arms straight, elevate shoulders straight toward your ears, and pause briefly at the top.'};
    return{pat:'row',label:'Horizontal Row Pull',cue:'Keep torso braced and neutral, pull elbows past your torso, and squeeze shoulder blades together.'};
  }
  if(m==='Shoulders'){
    if(n.includes('lateral')||n.includes('rear')||n.includes('face pull')||n.includes('front raise'))return{pat:'raise',label:'Deltoid Raise Arc',cue:'Lead with elbows using controlled tempo; raise to shoulder height without swinging momentum.'};
    return{pat:'ohp',label:'Vertical Overhead Press',cue:'Brace glutes and abs, press weight vertically overhead, and lock out biceps beside ears.'};
  }
  if(m==='Quads'){
    if(n.includes('leg extension'))return{pat:'leg_ext',label:'Knee Extension Arc',cue:'Keep hips planted in the seat, extend knees smoothly to full contraction, and lower slowly.'};
    if(n.includes('leg press')||n.includes('hack'))return{pat:'leg_press',label:'Sled Press Path',cue:'Keep lower back flat against the pad, descend to full knee flexion, and drive through mid-foot.'};
    if(n.includes('lunge')||n.includes('split')||n.includes('step-up'))return{pat:'lunge',label:'Split-Stance Descent',cue:'Keep torso upright, lower back knee toward the floor, and push strongly through front heel.'};
    return{pat:'squat',label:'Squat Descent & Drive',cue:'Brace core, sit hips down between heels with knees tracking over toes, and drive smoothly up.'};
  }
  if(m==='Hamstrings/Glutes'){
    if(n.includes('leg curl')||n.includes('nordic'))return{pat:'leg_curl',label:'Knee Flexion Arc',cue:'Keep hips pressed into the pad and curl heels toward glutes with a controlled eccentric.'};
    if(n.includes('thrust')||n.includes('bridge'))return{pat:'thrust',label:'Hip Extension Bridge',cue:'Tuck chin, drive through heels to full hip lockout, and squeeze glutes hard at the top.'};
    return{pat:'hinge',label:'Posterior Hip Hinge',cue:'Push hips straight back with soft knees until hamstrings stretch, then snap hips forward.'};
  }
  if(m==='Biceps'){
    return{pat:'curl',label:'Elbow Flexion Curl',cue:'Pin elbows at your sides, curl weight smoothly without swinging torso, and control the descent.'};
  }
  if(m==='Triceps'){
    if(n.includes('close-grip bench')||n.includes('dip'))return{pat:'bench_press',label:'Close-Grip Tricep Press',cue:'Keep elbows tucked close to your torso and drive through full tricep extension.'};
    return{pat:'tricep_ext',label:'Elbow Extension Arc',cue:'Keep upper arms locked in place, extend forearms fully, and resist the return stretch.'};
  }
  if(m==='Calves'){
    return{pat:'calf',label:'Ankle Plantarflexion',cue:'Pause in a deep bottom stretch, rise all the way onto big toes, and squeeze calves at the top.'};
  }
  if(m==='Core'){
    return{pat:'core',label:'Spinal / Hip Flexion',cue:'Exhale hard as you curl ribs toward pelvis (or raise legs), keeping lower back controlled.'};
  }
  return{pat:'bench_press',label:'Controlled Strength Path',cue:'Maintain a braced core, smooth tempo, and full range of motion on every rep.'};
}

/* ---------- Muscle Recovery & Weekly Hypertrophy Volume Engine ---------- */
const REC_GROUPS=[
  {id:'chest',name:'Chest',keys:['chest'],hrs:60},
  {id:'back',name:'Back',keys:['lats','upper_back','lower_back'],hrs:72},
  {id:'shoulders',name:'Shoulders',keys:['front_delts','rear_delts'],hrs:48},
  {id:'biceps',name:'Biceps',keys:['biceps'],hrs:48},
  {id:'triceps',name:'Triceps',keys:['triceps'],hrs:48},
  {id:'quads',name:'Quads',keys:['quads'],hrs:72},
  {id:'hamstrings',name:'Hamstrings',keys:['hamstrings'],hrs:72},
  {id:'glutes',name:'Glutes',keys:['glutes'],hrs:60},
  {id:'calves',name:'Calves',keys:['calves'],hrs:48},
  {id:'core',name:'Core',keys:['abs'],hrs:48}
];

function calcRecovery(){
  const now=Date.now();
  return REC_GROUPS.map(g=>{
    let totalFatiguePct=0;
    S.workouts.forEach(w=>{
      const ts=w.ts?new Date(w.ts).getTime():new Date(w.date+'T12:00:00').getTime();
      const elapsedHrs=Math.max(0,(now-ts)/36e5);
      if(elapsedHrs>g.hrs*1.5)return;
      let priSets=0,secSets=0;
      w.exs.forEach(x=>{
        const info=lookupEx(x.name);
        const workSets=x.sets.filter(s=>(s.tp||'main')!=='warmup');
        const sc=workSets.reduce((acc,s)=>acc+((s.tp||'main')==='drop'?1.2:1),0);
        if(!sc)return;
        if((info.pri||[]).some(k=>g.keys.includes(k)))priSets+=sc;
        else if((info.sec||[]).some(k=>g.keys.includes(k)))secSets+=sc;
      });
      if(!priSets&&!secSets)return;
      const initialDrop=Math.min(100,priSets*21+secSets*8);
      const reqHrs=g.hrs*(initialDrop/100);
      const remHrs=Math.max(0,reqHrs-elapsedHrs);
      if(remHrs>0){
        const curFatigue=(remHrs/g.hrs)*100;
        totalFatiguePct=Math.min(100,totalFatiguePct+curFatigue);
      }
    });
    const pct=Math.max(0,Math.min(100,Math.round(100-totalFatiguePct)));
    const hrsLeft=pct<100?Math.max(1,Math.round((100-pct)/100*g.hrs)):0;
    return{...g,pct,hrsLeft};
  });
}

function calcWeeklyVolume(){
  const cutoff=Date.now()-7*864e5;
  const vol=Object.fromEntries(REC_GROUPS.map(g=>[g.id,0]));
  S.workouts.forEach(w=>{
    const ts=w.ts?new Date(w.ts).getTime():new Date(w.date+'T12:00:00').getTime();
    if(ts<cutoff)return;
    w.exs.forEach(x=>{
      const info=lookupEx(x.name);
      const workSets=x.sets.filter(s=>(s.tp||'main')!=='warmup').length;
      if(!workSets)return;
      REC_GROUPS.forEach(g=>{
        if((info.pri||[]).some(k=>g.keys.includes(k)))vol[g.id]+=workSets;
        else if((info.sec||[]).some(k=>g.keys.includes(k)))vol[g.id]+=workSets*0.5;
      });
    });
  });
  return REC_GROUPS.map(g=>({...g,sets:Math.round(vol[g.id]*10)/10}));
}

function getUnlockedBadges(prsObj){
  const P=prsObj||S.prs||{};
  const unlocked={};
  const bMax=P['Bench Press']?.w||0;

  const dMax=P['Deadlift']?.w||0;
  const sbd=bMax+sMax+dMax;
  MILESTONE_DEFS.forEach(g=>{
    const cur=g.isClub?sbd:Math.max(0,...g.lifts.map(n=>P[n]?.w||0));
    g.tiers.forEach(t=>{
      const key=`${g.id}_${t.w}`;
      if(cur>=t.w){

          const dates=[P['Bench Press']?.h?.slice(-1)[0]?.d,P['Squat']?.h?.slice(-1)[0]?.d,P['Deadlift']?.h?.slice(-1)[0]?.d].filter(Boolean).sort();
          uDate=dates[dates.length-1]||ld();
        }else{
          const hist=(P[g.lifts[0]]?.h||[]).find(h=>h.w>=t.w);
          uDate=hist?hist.d:ld();
        }
        unlocked[key]=uDate;
      }
    });

}

function prCheck(P,n,w,r,date){const e=w*(1+r/30),p=P[n]||(P[n]={w:0,e:0,h:[]}),first=p.w===0;let t=null;if(w>p.w)t='Weight PR';else if(e>p.e+.01)t='Est. 1RM PR';

function recalcPRs(){
  const P={};
  const sorted=[...S.workouts].sort((a,b)=>(a.ts||a.date)<(b.ts||b.date)?-1:1);
  sorted.forEach(w=>{
    w.exs.forEach(x=>{
      x.sets.forEach(s=>{
        delete s.pr;
        if((s.tp||'main')!=='warmup'&&+s.w>0&&+s.r>0){
          const t=prCheck(P,x.name,+s.w,+s.r,w.date);
          if(t)s.pr=t;

    });
  });
  S.prs=P;
}

    if(raw>1000)warns.push(`Reaching ${tw} lb by that date would need about +${Math.round(raw)} kcal/day. Surplus is capped at +1,000.`);

function calcStreak(){
  const g=G();
  if(!g.cal||!g.p)return 0;
  const byDay={};
  S.log.forEach(m=>{
    const d=ld(new Date(m.ts));
    if(!byDay[d])byDay[d]={cal:0,p:0};
    byDay[d].cal+=m.cal;byDay[d].p+=m.p;
  });
  const hit=d=>{
    const x=byDay[d];if(!x)return false;
    return Math.abs(x.cal-g.cal)<=g.cal*0.12 && x.p>=g.p*0.9;
  };
  let streak=0;
  const cur=new Date();
  if(!hit(ld(cur)))cur.setDate(cur.getDate()-1);
  while(hit(ld(cur))){streak++;cur.setDate(cur.getDate()-1);}
  return streak;
}

function calcAdaptiveTDEE(){
  const c14=ld(new Date(Date.now()-14*864e5));
  const recentW=S.weigh.filter(x=>x.date>=c14);
  if(recentW.length<2)return null;
  const first=recentW[0],last=recentW[recentW.length-1];
  const daySpan=Math.max(1,Math.round((new Date(last.date+'T00:00')-new Date(first.date+'T00:00'))/864e5));
  if(daySpan<5)return null;
  const byDay={};
  S.log.filter(m=>ld(new Date(m.ts))>=first.date&&ld(new Date(m.ts))<=last.date).forEach(m=>{
    const d=ld(new Date(m.ts));byDay[d]=(byDay[d]||0)+m.cal;
  });
  const loggedDays=Object.values(byDay).filter(c=>c>500);
  if(loggedDays.length<3)return null;
  const avgIntake=Math.round(loggedDays.reduce((a,b)=>a+b,0)/loggedDays.length);
  const weightDelta=last.w-first.w;
  const dailySurplusActual=(weightDelta*3500)/daySpan;
  const estTDEE=Math.round(avgIntake-dailySurplusActual);
  const actualWkRate=+(weightDelta/daySpan*7).toFixed(2);
  const g=G(),targetWkRate=+g.wk;
  if(!g.cal)return null;
  const diff=actualWkRate-targetWkRate;
  let delta=0,msg='';
  if(g.mode==='bulk'&&diff<-0.35){
    delta=150;msg=`Weight is moving at ${actualWkRate} lb/wk vs your +${targetWkRate} lb/wk bulk target (est. real TDEE ~${estTDEE.toLocaleString()} kcal).`;
  }else if(g.mode==='cut'&&diff>0.35){
    delta=-150;msg=`Weight change is ${actualWkRate} lb/wk vs your ${targetWkRate} lb/wk cut target (est. real TDEE ~${estTDEE.toLocaleString()} kcal).`;
  }else if(g.mode==='maintain'&&Math.abs(actualWkRate)>0.45){
    delta=actualWkRate>0?-150:150;msg=`Weight shifted ${actualWkRate>0?'+':''}${actualWkRate} lb/wk at maintenance (est. real TDEE ~${estTDEE.toLocaleString()} kcal).`;

}

/* ---------- Web Audio API Rest Timer Chime ---------- */
let rest={start:0,target:120,alerted:0};
function playRestChime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const playBeep=(freq,time)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.25,ctx.currentTime+time);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+time+0.18);
      osc.start(ctx.currentTime+time);
      osc.stop(ctx.currentTime+time+0.2);
    };
    playBeep(880,0);
    playBeep(1174.66,0.22);
    setTimeout(()=>ctx.close(),600);
  }catch(e){}
}

function getMiniStatus(){
  if(!S.act)return{ex:'Active Workout',set:'Tap to resume'};
  if(!S.act.exs.length)return{ex:S.act.title||'Workout',set:'Tap to add first exercise'};
  for(let i=S.act.exs.length-1;i>=0;i--){
    const x=S.act.exs[i];
    const nextIdx=x.sets.findIndex(s=>!s.done);
    if(nextIdx>=0)return{ex:x.name,set:`Set ${nextIdx+1} of ${x.sets.length}`};
  }
  const last=S.act.exs[S.act.exs.length-1];
  return{ex:last.name,set:`All ${last.sets.length} sets done`};
}

function updateRestUI(){
  const goalStr=fm(rest.target);
  if($('#rgoal'))$('#rgoal').textContent='Target: '+goalStr;
  document.querySelectorAll('#rpresets button').forEach(b=>b.classList.toggle('on',+b.dataset.id===rest.target));
  const rt=$('#rtime'),mbr=$('#mb-rest'),mbb=$('#mb-rest-box');
  if(!rest.start){
    if(rt){rt.textContent='0:00';rt.classList.remove('over');}
    if(mbr)mbr.textContent='0:00';
    if(mbb)mbb.classList.remove('over');
    return;
  }
  const el=Math.floor((Date.now()-rest.start)/1e3);
  const str=fm(el);
  if(rt)rt.textContent=str;
  if(mbr)mbr.textContent=str;
  if(el>=rest.target){
    if(rt)rt.classList.add('over');
    if(mbb)mbb.classList.add('over');
    if(!rest.alerted){rest.alerted=1;playRestChime();beep();}
  }else{
    if(rt)rt.classList.remove('over');
    if(mbb)mbb.classList.remove('over');
  }
}

function calcPlatesPerSide(totalWeight,barWeight=45){
  let rem=(totalWeight-barWeight)/2;
  if(rem<=0)return[];
  const avail=[45,35,25,10,5,2.5];
  const res=[];
  avail.forEach(p=>{
    while(rem>=p-0.001){res.push(p);rem-=p;}
  });
  return res;
}

      <input id="bcode-in" placeholder="e.g. 810132040129" inputmode="numeric">

    </div>
    <h2 style="margin:14px 0 6px;font-size:13px;color:var(--mu)">Quick Scan Sample Products</h2>
    <div id="bsamples">
      ${BARCODE_DB.map((b,i)=>`<div class="meal" style="padding:8px 0">
        <div class="i"><b>${esc(b.name)}</b><span class="mac">UPC: ${b.code} · ${b.cal} kcal (${b.p}P / ${b.c}C / ${b.f}F)</span></div>
        <button class="btn sm" data-bidx="${i}">Scan</button>
      </div>`).join('')}
    </div>`);
  const video=o.querySelector('#bvid');
  let mediaStream=null;
  navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    mediaStream=stream;video.srcObject=stream;
  }).catch(()=>{});
  const close=()=>{mediaStream?.getTracks().forEach(t=>t.stop());o.remove();};
  o.querySelector('#bx').onclick=close;

  const triggerMatch=(item,sourceLabel='Local Index')=>{
    close();
    tab('chat');
    S.chat.push({r:'u',t:`[Scanned Barcode: ${item.code}]`});
    const a={r:'a',t:`✅ Matched **${item.name}** (${item.serving||'1 serving'}) via **${sourceLabel}**! Tap below to log it to today's macros:`,meal:{name:item.name,cal:Math.round(item.cal),p:Math.round(item.p),c:Math.round(item.c),f:Math.round(item.f)}};
    S.chat.push(a);
    save();rChat();toast('Barcode matched!');
  };

  o.querySelector('#blookup').onclick=async()=>{
    const code=o.querySelector('#bcode-in').value.trim();
    if(!code){toast('Enter a barcode number');return;}
    const btn=o.querySelector('#blookup');
    btn.disabled=true;btn.textContent='Searching...';
    // 1. Check instant local database first
    const localFound=BARCODE_DB.find(x=>x.code===code);
    if(localFound){triggerMatch(localFound,'Local Barcode Index');return;}
    // 2. Query Open Food Facts Live API (3M+ products, free, no API key)
    try{
      const res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
      const data=await res.json();
      if(data&&data.status===1&&data.product){
        const p=data.product,n=p.nutriments||{};
        const name=[p.brands,p.product_name].filter(Boolean).join(' - ')||'Packaged Food';
        const serving=p.serving_size||'1 serving (100g)';
        const cal=n['energy-kcal_serving']??n['energy-kcal_100g']??0;
        const pro=n.proteins_serving??n.proteins_100g??0;
        const carb=n.carbohydrates_serving??n.carbohydrates_100g??0;
        const fat=n.fat_serving??n.fat_100g??0;
        triggerMatch({code,name,serving,cal,p:pro,c:carb,f:fat},'Open Food Facts Database');
        return;
      }
      toast('Barcode not found in database');
    }catch(err){
      toast('Offline — checked local barcode DB');
    }finally{
      btn.disabled=false;btn.textContent='Lookup';
    }
  };
  o.querySelector('#bsamples').onclick=e=>{
    const b=e.target.closest('[data-bidx]');
    if(b)triggerMatch(BARCODE_DB[+b.dataset.bidx],'Local Barcode Index');
  };
}

// Exclude 'double'/'triple' from generic quantity words so "McDouble", "Double Cheeseburger", "Double-Double" never accidentally multiply by 2x
const WORD_NUMS={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12,half:0.5,quarter:0.25,whole:1,entire:1,full:1};

function parseFoodMatches(text){
  let q=text.toLowerCase().replace(/½/g,'0.5').replace(/¼/g,'0.25').replace(/¾/g,'0.75');
  const matched=[];
  let consumed=q;

  const sortedLexicon=[...FOOD_LEXICON].sort((a,b)=>Math.max(...b.keys.map(k=>k.length))-Math.max(...a.keys.map(k=>k.length)));

  for(const item of sortedLexicon){
    const sortedKeys=[...item.keys].sort((a,b)=>b.length-a.length);
    for(const k of sortedKeys){
      // Also match plural 's' at the end of a key (e.g. "mcdoubles", "whoppers", "burritos")
      const escapedKey=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const keyRegex=new RegExp(`(?:^|[^a-z0-9])${escapedKey}s?(?=$|[^a-z0-9])`,'i');
      if(keyRegex.test(consumed)){
        // Extract preceding quantity, size, & unit
        const quantRegex=new RegExp(`(?:(\\d+(?:\\.\\d+)?|\\b(?:a|an|one|two|three|four|five|six|seven|eight|nine|ten|twelve|half|quarter|whole|entire|full)\\b)\\s*(?:(whole\\s+box(?:es)?|entire\\s+box(?:es)?|full\\s+box(?:es)?|box(?:es)?|whole\\s+bag|entire\\s+bag|bag(?:s)?|whole\\s+pizza|entire\\s+pizza|whole\\s+pie|cups?|glass(?:es)?|oz|ounces?|lbs?|pounds?|g|grams?|tbsp|tablespoons?|tsp|teaspoons?|scoops?|slices?|pieces?|pcs?|bites?|nuggets?|strips?|tenders?|wings?|servings?|bowls?|cans?|bottles?|bars?|packs?|packets?|fillets?|containers?)\\s*)?(?:of\\s+)?)?(?:(small|medium|large|extra\\s+large|xl)\\s+)?${escapedKey}s?`,'i');
        const m=consumed.match(quantRegex);
        let qty=1,unitStr='',sizeMod='';
        if(m){
          if(m[1]){
            const rawQ=m[1].toLowerCase();
            qty=WORD_NUMS[rawQ]!==undefined?WORD_NUMS[rawQ]:parseFloat(rawQ);
          }
          if(m[2])unitStr=m[2].toLowerCase().trim();
          if(m[3])sizeMod=m[3].toLowerCase().trim();
        }
        if(isNaN(qty)||qty<=0)qty=1;

        // Calculate unit & size multiplier accurately
        let mult=qty;
        let labelPrefix='';
        if((unitStr.includes('box')||unitStr.includes('whole pizza')||unitStr.includes('entire pizza')||unitStr.includes('whole pie')||unitStr.includes('container')||unitStr.includes('whole bag')||unitStr.includes('entire bag')) && !item.isBox){
          const boxMult=item.servingsPerBox||3;
          mult=qty*boxMult;
          labelPrefix=qty===1?`Whole Box/Pack (${boxMult} servings) `:`${qty} Boxes (${qty*boxMult} servings) `;
        }else if(unitStr.startsWith('g')&&!unitStr.startsWith('glass')){
          const baseG=item.baseG||100;
          mult=qty/baseG;
          labelPrefix=`${Math.round(qty)}g `;
        }else if(unitStr.startsWith('oz')||unitStr.startsWith('ounce')){
          const baseOz=item.baseOz||(item.baseG?item.baseG/28.35:4);
          mult=qty/baseOz;
          labelPrefix=`${qty} oz `;
        }else if(unitStr.startsWith('lb')||unitStr.startsWith('pound')){
          const baseOz=item.baseOz||(item.baseG?item.baseG/28.35:4);
          mult=(qty*16)/baseOz;
          labelPrefix=`${qty} lb `;
        }else if(unitStr.startsWith('tbsp')||unitStr.startsWith('tablespoon')){
          mult=item.unit.includes('2 tbsp')?qty/2:qty;
          labelPrefix=`${qty} tbsp `;
        }else if(unitStr.startsWith('tsp')||unitStr.startsWith('teaspoon')){
          mult=item.unit.includes('2 tbsp')?qty/6:qty/3;
          labelPrefix=`${qty} tsp `;
        }else if(unitStr.match(/^(piece|pc|bite|nugget|strip|tender)/)&&item.basePcs&&item.basePcs>1){
          mult=qty/item.basePcs;
          labelPrefix=`${qty} ${unitStr} `;
        }else if(unitStr.startsWith('slice')||unitStr.startsWith('piece')){
          mult=qty;
          labelPrefix=`${qty} ${qty===1?'slice':'slices'} `;
        }else if(unitStr.startsWith('serving')){
          mult=qty;
          labelPrefix=qty===1?'1 serving ':`${qty} servings `;
        }else{
          if(qty>25&&!unitStr){
            const baseG=item.baseG||100;
            mult=qty/baseG;
            labelPrefix=`${Math.round(qty)}g `;
          }else if(qty>1&&item.basePcs&&item.basePcs>=4&&qty>=3&&!unitStr){
            // e.g. "10 tyson boneless chicken bites" when 1 serving is ~6 bites
            mult=qty/item.basePcs;
            labelPrefix=`${qty} pcs `;
          }else if(qty!==1){
            labelPrefix=`${qty}× `;
          }
        }

        // Apply Small/Medium/Large modifier if the item itself isn't already size-specific
        if(sizeMod && !k.includes(sizeMod)){
          if(sizeMod==='small'){mult*=0.75;labelPrefix+=`Small `;}
          else if(sizeMod==='large'){mult*=1.35;labelPrefix+=`Large `;}
          else if(sizeMod.includes('xl')||sizeMod.includes('extra large')){mult*=1.65;labelPrefix+=`XL `;}
        }

        matched.push({
          item,
          displayName:labelPrefix+item.name,
          cal:Math.round(item.cal*mult),
          p:Math.round(item.p*mult),
          c:Math.round(item.c*mult),
          f:Math.round(item.f*mult)
        });

        // Blank out matched segment AND any surrounding brand/descriptor words in that clause so "McDonald's McDouble" never also matches generic "beef" or "burger"
        consumed=consumed.replace(m?m[0]:k,'   ');
        break;
      }
    }
  }
  return matched;
}

function tryExtractMealFromText(text){
  const matched=parseFoodMatches(text);
  if(!matched.length)return null;
  const total=matched.reduce((a,b)=>({cal:a.cal+b.cal,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f}),{cal:0,p:0,c:0,f:0});
  const title=matched.map(x=>x.displayName).join(' + ');
  return{name:title,cal:total.cal,p:total.p,c:total.c,f:total.f,items:matched};
}

/* Tier 3: Smart Compositional Macro Estimator (handles any unlisted food or restaurant item accurately) */
function estimateUnknownFoodCompositional(rawText){
  const q=rawText.toLowerCase().trim();
  const foodIndicators=/(chicken|beef|pork|turkey|steak|salmon|fish|shrimp|tuna|burger|sandwich|sub|wrap|burrito|taco|quesadilla|nugget|bite|tender|strip|wing|pizza|pasta|mac|rice|noodle|fries|potato|chip|tot|salad|bowl|soup|chili|egg|pancake|waffle|muffin|bagel|toast|bread|cereal|oat|yogurt|cheese|milk|shake|smoothie|bar|cookie|brownie|ice cream|donut|dumpling|roll|corndog|hot dog|sausage|brat|rib|brisket|tyson|kirkland|perdue|banquet|marie callender|lean cuisine|healthy choice|stouffer|amy|trader joe|aldi|costco|wendy|mcdonald|burger king|taco bell|chipotle|chick-fil-a|popeyes|kfc|arby|sonic|dairy queen|five guys|shake shack|whataburger|jack in the box|carl's jr|hardee|panera|subway|jersey mike|jimmy john|firehouse|zaxby|cane|wingstop|buffalo wild wings|domino|papa john|pizza hut|little caesar)/i;
  if(!foodIndicators.test(q))return null;

  // Determine base profile by category
  let base={cal:220,p:14,c:16,f:11,unit:'serving (3 oz)',baseOz:3,basePcs:5};
  if(/(boneless.*bite|chicken.*bite|popcorn chicken|anytizer|boneless.*wing|nugget|tender|strip|finger)/i.test(q)){
    const lightly=/(lightly breaded|air fried|bare)/i.test(q);
    base=lightly
      ?{cal:160,p:16,c:9,f:6,unit:'serving (3 oz / ~6 pcs)',baseOz:3,basePcs:6}
      :{cal:205,p:14,c:14,f:10.5,unit:'serving (3 oz / ~6 pcs)',baseOz:3,basePcs:6};
  }else if(/(grilled chicken|blackened chicken|rotisserie)/i.test(q)){
    base={cal:140,p:26,c:1,f:3,unit:'serving (4 oz)',baseOz:4,basePcs:1};
  }else if(/(chicken sandwich|crispy chicken|spicy chicken)/i.test(q)){
    base={cal:470,p:26,c:44,f:21,unit:'sandwich',baseOz:7,basePcs:1};
  }else if(/(double.*burger|double.*cheeseburger|bacon.*burger)/i.test(q)){
    base={cal:680,p:38,c:40,f:41,unit:'burger',baseOz:8,basePcs:1};
  }else if(/(burger|cheeseburger|slider)/i.test(q)){
    base={cal:420,p:22,c:35,f:21,unit:'burger',baseOz:5.5,basePcs:1};
  }else if(/(burrito)/i.test(q)){
    base={cal:550,p:22,c:64,f:22,unit:'burrito',baseOz:9,basePcs:1};
  }else if(/(bowl)/i.test(q)){
    base={cal:520,p:28,c:56,f:18,unit:'bowl',baseOz:11,basePcs:1};
  }else if(/(pizza)/i.test(q)){
    base={cal:270,p:11,c:31,f:11,unit:'slice',baseOz:3.5,basePcs:1};
  }else if(/(fries|tater tot|onion ring|curd)/i.test(q)){
    base={cal:340,p:5,c:44,f:17,unit:'medium order',baseOz:4,basePcs:1};
  }else if(/(shake|milkshake|smoothie|frappe|frosty)/i.test(q)){
    base={cal:420,p:10,c:66,f:13,unit:'medium cup',baseOz:12,basePcs:1};
  }

  // Extract quantity & unit from user prompt
  let mult=1,prefix='';
  const numM=q.match(/(\d+(?:\.\d+)?|\b(?:two|three|four|five|six|seven|eight|nine|ten|twelve|half)\b)\s*(whole\s+box|box|bag|oz|ounces?|g|grams?|lbs?|pounds?|servings?|pieces?|pcs?|bites?|nuggets?|strips?|tenders?|slices?|bowls?|burgers?|sandwiches?)?/i);
  if(numM){
    const rawQ=numM[1].toLowerCase();
    const qty=WORD_NUMS[rawQ]!==undefined?WORD_NUMS[rawQ]:parseFloat(rawQ);
    const u=(numM[2]||'').toLowerCase();
    if(u.includes('box')||u.includes('bag')){mult=qty*6;prefix=`${qty} Box/Bag `;}
    else if(u.startsWith('oz')){mult=qty/(base.baseOz||3);prefix=`${qty} oz `;}
    else if(u.startsWith('g')){mult=qty/((base.baseOz||3)*28.35);prefix=`${qty}g `;}
    else if(u.match(/^(piece|pc|bite|nugget|strip|tender)/)&&base.basePcs>1){mult=qty/base.basePcs;prefix=`${qty} ${u} `;}
    else if(qty>=4&&base.basePcs>1&&!u){mult=qty/base.basePcs;prefix=`${qty} pcs `;}
    else if(qty!==1){mult=qty;prefix=`${qty}× `;}
  }else if(/\b(whole|entire|full)\s+(box|bag|package)\b/i.test(q)){
    mult=6;prefix='Whole Bag/Box ';
  }

  if(/\bsmall\b/i.test(q)){mult*=0.75;prefix+='Small ';}
  else if(/\blarge\b/i.test(q)){mult*=1.35;prefix+='Large ';}

  const cleanTitle=rawText.replace(/^(i ate|i had|log|add|what are the macros for|calories in|macros in|macros for)\s+/i,'').replace(/[?!.]/g,'').trim();
  const displayTitle=prefix+(cleanTitle.charAt(0).toUpperCase()+cleanTitle.slice(1));
  return{
    name:displayTitle,
    serving:base.unit,
    cal:Math.round(base.cal*mult),
    p:Math.round(base.p*mult),
    c:Math.round(base.c*mult),
    f:Math.round(base.f*mult),
    source:'Smart Nutrition Estimator'
  };
}

/* Tier 2: Fast Open Food Facts v2 Search with Macro Sanity Validation */
async function searchOpenFoodFactsText(rawText){
  const clean=rawText.toLowerCase()
    .replace(/^(i ate|i had|log|add|what are the macros for|what are the calories in|calories in|macros in|macros for|how many calories in)\s+/i,'')
    .replace(/[?!.]/g,'').trim();
  if(clean.length<3)return null;

  let mult=1,prefix='';
  const boxMatch=clean.match(/\b(whole|entire|full)\s+(box|bag|container|package|pizza|pie)\b/i);
  const numMatch=clean.match(/^(\d+(?:\.\d+)?)\s*(boxes|bags|containers|servings|cups|slices|pieces|bites|nuggets|strips|bars|bottles|cans|oz|g)?\s*(?:of\s+)?/i);
  let searchQuery=clean
    .replace(/\b(a|an|the|whole|entire|full|box|boxes|bag|bags|container|package|servings?|pieces?|bites?|of|from)\b/gi,' ')
    .replace(/^\d+(?:\.\d+)?\s*/,'')
    .replace(/\s+/g,' ').trim();

  if(!searchQuery||searchQuery.length<3)searchQuery=clean;

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),3200);
    const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(searchQuery)}&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments,serving_size,serving_quantity,product_quantity`;
    const res=await fetch(url,{signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok)return estimateUnknownFoodCompositional(rawText);
    const data=await res.json();
    const products=(data.products||[]).filter(p=>{
      if(!p.product_name||!p.nutriments)return false;
      const kcal=p.nutriments['energy-kcal_serving']||p.nutriments['energy-kcal_100g'];
      return kcal>15 && kcal<1800;
    });
    if(!products.length)return estimateUnknownFoodCompositional(rawText);

    const p=products[0],n=p.nutriments||{};
    const brand=p.brands?p.brands.split(',')[0].trim():'';
    const baseName=brand&&!p.product_name.toLowerCase().includes(brand.toLowerCase())?`${brand} ${p.product_name}`:p.product_name;

    // Prefer per-serving values; if only 100g exists and serving_quantity is known, scale 100g -> serving
    const srvG=parseFloat(p.serving_quantity)||85;
    const hasSrv=n['energy-kcal_serving']!==undefined && n.proteins_serving!==undefined;
    let cal=hasSrv?+n['energy-kcal_serving']:((+n['energy-kcal_100g']||0)*(srvG/100));
    let pro=hasSrv?+n.proteins_serving:((+n.proteins_100g||0)*(srvG/100));
    let carb=hasSrv?+n.carbohydrates_serving:((+n.carbohydrates_100g||0)*(srvG/100));
    let fat=hasSrv?+n.fat_serving:((+n.fat_100g||0)*(srvG/100));

    // Sanity check: ensure calories roughly align with 4P + 4C + 9F
    const macroCal=pro*4+carb*4+fat*9;
    if(macroCal>20 && (cal<macroCal*0.5 || cal>macroCal*1.6)){
      cal=macroCal;
    }

    if(boxMatch){
      const spb=(p.product_quantity&&p.serving_quantity&&+p.serving_quantity>0)?Math.max(1,Math.min(12,Math.round(+p.product_quantity/+p.serving_quantity))):4;
      mult=spb;
      prefix=`Whole Box/Pack (${spb} servings) `;
    }else if(numMatch){
      const qVal=parseFloat(numMatch[1])||1;
      const uVal=(numMatch[2]||'').toLowerCase();
      if(uVal==='oz')mult=(qVal*28.35)/srvG;
      else if(uVal==='g')mult=qVal/srvG;
      else if(uVal==='bites'||uVal==='pieces'||uVal==='nuggets')mult=qVal/5;
      else mult=qVal;
      if(mult!==1)prefix=`${qVal}${uVal?' '+uVal:'×'} `;
    }

    return{
      name:prefix+baseName,
      serving:p.serving_size||`${Math.round(srvG)}g serving`,
      cal:Math.round(cal*mult),
      p:Math.round(pro*mult),
      c:Math.round(carb*mult),
      f:Math.round(fat*mult),
      source:'Open Food Facts Live DB'
    };
  }catch(e){
    return estimateUnknownFoodCompositional(rawText);
  }
}

        :`For **maintenance**, both fit easily—pick **${hiP.item.name}** when you’re short on protein (${remP}g left today).`;
      return{
        text:`⚖️ **Side-by-Side Nutrition Comparison:**\n${lines}\n\n💡 **Coach Verdict (${MODES[g.mode]} Phase):** ${phaseAdvice}\n\n*(If you actually ate one of these, just tell me which one or tap below!)*`,
        meal:items.length===1?{name: parsedFood.name, cal: parsedFood.cal, p: parsedFood.p, c: parsedFood.c, f: parsedFood.f}:undefined
      };
    }

    const first=items[0];
    const phaseNote=g.mode==='bulk'
      ?(first.cal>=250?`Great calorie-dense choice for your **bulk**!`:`Solid option—pair it with extra carbs or healthy fats if you need help reaching your ${g.cal.toLocaleString()} kcal bulk target.`)
      :g.mode==='cut'
      ?(first.p*4/Math.max(1,first.cal)>=0.25?`High protein density (${Math.round(first.p*4/Math.max(1,first.cal)*100)}% of calories from protein)—excellent for your **cut**!`:`Fits your **cut** as long as you budget the **${first.cal} kcal** into your ${remCal} kcal remaining today.`)
      :`Fits cleanly into your **maintenance** macros (${remCal} kcal left today).`;

    return{
      text:`🔍 **Nutrition Facts — ${ parsedFood.name }:**\n• **Calories:** ${parsedFood.cal} kcal\n• **Protein:** ${parsedFood.p}g\n• **Carbs:** ${parsedFood.c}g\n• **Fat:** ${parsedFood.f}g\n\n💡 **Coach Take:** ${phaseNote}\n\nWant to log this to today’s tracker? Tap **Log Meal** below:`,
      meal:{name:parsedFood.name,cal:parsedFood.cal,p:parsedFood.p,c:parsedFood.c,f:parsedFood.f}
    };
  }

  // 4. Exercise Form, PRs & Muscle Questions
  const matchedEx=DB.find(x=>q.includes(x.n.toLowerCase())) ||
    (q.includes('bench')?DB_MAP['Bench Press']:q.includes('squat')?DB_MAP['Squat']:q.includes('deadlift')&&!q.includes('romanian')?DB_MAP['Deadlift']:q.includes('rdl')||q.includes('romanian')?DB_MAP['Romanian Deadlift']:q.includes('overhead press')||q.includes('ohp')?DB_MAP['Overhead Press']:q.includes('pull-up')||q.includes('pullup')?DB_MAP['Pull-Up']:q.includes('lat pulldown')?DB_MAP['Lat Pulldown']:null);

  if(matchedEx && !parsedFood){
    const guide=getMovementGuide(matchedEx);
    const pr=S.prs[matchedEx.n];
    const priNames=(matchedEx.pri||[]).map(k=>MUSCLE_NAMES[k]||k).join(', ');
    const prLine=pr&&pr.w>0?`Your current best is **${pr.w} lb** (Est. 1RM **${Math.round(pr.e)} lb**). Aim to add 1 rep per set or +2.5–5 lb on your top set!`:`You haven't logged a PR on **${matchedEx.n}** yet—start with 3 working sets of 8–10 reps leaving 1–2 reps in reserve.`;
    return{
      text:`🏋️ **${matchedEx.n}** (${matchedEx.m} · ${matchedEx.e})\n\n• **Primary Muscles:** ${priNames}\n• **Form Cue (${guide.label}):** ${guide.cue}\n• **Progression Advice:** ${prLine}`
    };
  }

  // 5. Direct Food Logging (Single or Multi-Item Meals with Brands & Portions)
  if(parsedFood && !q.includes('what should i eat') && !q.includes('meal idea') && !q.includes('recommend')){
    const newRemCal=Math.max(0,remCal-parsedFood.cal);
    const newRemP=Math.max(0,remP-parsedFood.p);
    const breakdown=parsedFood.items&&parsedFood.items.length>1
      ?`\n\n**Itemized Breakdown:**\n`+parsedFood.items.map(i=>`• ${i.displayName}: ${i.cal} kcal (${i.p}P / ${i.c}C / ${i.f}F)`).join('\n')
      :'';
    return{
      text:`🍽️ **Meal Calculated (${parsedFood.name}):**\n• **Total:** **${parsedFood.cal} kcal** (${parsedFood.p}g Protein · ${parsedFood.c}g Carbs · ${parsedFood.f}g Fat)${breakdown}\n\nLogging this leaves you with **${newRemCal.toLocaleString()} kcal** and **${newRemP}g protein** for today. Tap **Log Meal** below!`,
      meal:{name:parsedFood.name,cal:parsedFood.cal,p:parsedFood.p,c:parsedFood.c,f:parsedFood.f}
    };
  }

  // 6. Meal Recommendations / Short on Calories or Protein
  if(q.includes('short')||q.includes('what should i eat')||q.includes('meal idea')||q.includes('snack')||q.includes('recommend')||q.includes('hungry')||q.includes('high-protein')||q.includes('high protein')){
    const targetCal=remCal>150?Math.min(850,remCal):500;
    let recMeal={name:'6 oz Grilled Chicken Breast + 1.5× Cooked Jasmine Rice',cal:588,p:59,c:68,f:7};
    if(g.mode==='cut'||targetCal<420){
      recMeal={name:'0% Nonfat Greek Yogurt + Scoop Whey Protein + Berries',cal:295,p:43,c:27,f:2};
    }else if(g.mode==='bulk'&&remCal>700){
      recMeal={name:'Chipotle Chicken Burrito Bowl + Fairlife 2% Milk',cal:785,p:60,c:74,f:26};
    }
    return{
      text:`🔥 You have **${remCal.toLocaleString()} kcal** and **${remP}g protein** left today (${t.cal.toLocaleString()}/${g.cal.toLocaleString()} kcal eaten on your **${MODES[g.mode]}** plan).\n\nHere’s a macro-friendly meal tailored to your remaining budget—tap **Log Meal** below if you eat it:`,
      meal:recMeal
    };
  }

  // 7. Muscle Recovery & What to Train Today
  if(q.includes('recover')||q.includes('sore')||q.includes('fresh')||q.includes('train today')||q.includes('what should i train')||q.includes('split')||q.includes('routine')){
    const fresh=recs.filter(r=>r.pct===100).map(r=>r.name);
    const fatigued=recs.filter(r=>r.pct<100).map(r=>`${r.name} (${r.pct}%)`);
    return{
      text:`🔋 **Muscle Recovery Breakdown:**\n• **100% Fresh & Ready:** ${fresh.join(', ')||'None'}\n${fatigued.length?`• **Still Recovering:** ${fatigued.join(', ')}\n`:''}\n💡 **Coach Recommendation:** Your **${fresh.slice(0,3).join(', ')||'primary muscle groups'}** are 100% recovered—head to the **Workout** tab to launch one of your saved routines!`
    };
  }

  // 8. Cutting / Bulking / Maintaining Strategy Questions
  if(q.includes('cut')||q.includes('lose fat')||q.includes('deficit')||q.includes('keep my strength')){
    return{
      text:`🔪 **Cutting & Strength Preservation Guide:**\n1. **Hit Your Protein Floor:** Aim for **${g.p}g protein/day** (1.15g/lb) so your body burns fat instead of muscle tissue.\n2. **Keep Lifting Heavy:** Maintain intensity (weight on the bar) in the 5–10 rep range even if you drop 1 set per exercise for recovery.\n3. **High-Satiety Swaps:** Swap Whole Milk (150 kcal/8P) for **Fairlife Skim (80 kcal/13P)** or **0% Greek Yogurt**, and choose **93/7 or 96/4 ground beef** over 80/20.`
    };
  }
  if(q.includes('bulk')||q.includes('gain weight')||q.includes('build muscle')||q.includes('surplus')){
    return{
      text:`📈 **Lean Bulking Guide:**\n1. **Steady Surplus:** Your target is **${g.cal.toLocaleString()} kcal/day** (+${Math.abs(g.sur)} kcal surplus) for ~${g.wk} lb/week gain.\n2. **Easy Liquid & Dense Calories:** Whole milk (150 kcal/cup), Fairlife Core Power shakes, peanut butter (190 kcal/2 tbsp), pasta, and jasmine rice make hitting calories effortless.\n3. **Progressive Overload:** Track every set in the Workout tab and aim to beat your previous reps or weight each week!`
    };
  }

  // 9. Smart Contextual Fallback
  return{
    text:`💪 **Llama On-Device Coach:**\nHere’s your live snapshot:\n• **Phase:** ${MODES[g.mode]} (${t.cal.toLocaleString()} / ${g.cal.toLocaleString()} kcal eaten)\n• **Remaining Today:** **${remCal.toLocaleString()} kcal** · **${remP}g Protein** · ${Math.max(0,g.c-t.c)}g Carbs · ${Math.max(0,g.f-t.f)}g Fat\n\nTry telling me what you ate (e.g., *"2 cups whole milk and a bowl of Velveeta mac and cheese"*), asking a food question (*"Compare 80/20 vs 93/7 ground beef"*), or asking about any lift!`
  };
}

let pend=null,busy=false;
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function parse(t){const i=t.indexOf('MEAL_JSON');if(i<0)return{text:t.trim()};let meal=null;try{const j=t.slice(i).match(/\{[^}]*\}/);if(j){const o=JSON.parse(j[0]);meal={name:String(o.name||'Meal'),cal:Math.round(o.cal),p:Math.round(o.p),c:Math.round(o.c),f:Math.round(o.f)};if([meal.cal,meal.p,meal.c,meal.f].some(isNaN))meal=null}}catch(e){}return{text:t.slice(0,i).trim(),meal}}

function rChat(){
  $('#msgs').innerHTML=S.chat.map((m,i)=>`<div class="m ${m.r}">${m.img?`<img src="${m.img}" alt="Meal photo">`:''}${m.wait&&!m.t?'<span class="dot">●●●</span>':fmt(m.t)}${m.meal?`<div class="mc"><b>${esc(m.meal.name)}</b><br><span class="mac">${m.meal.cal} kcal</span> · ${mac(m.meal)}<div class="r"><button class="btn sm" data-a="clog" data-id="${i}"${m.done?' disabled':''}>${m.done?'Logged ✓':'Log Meal'}</button><button class="btn sm s" data-a="csave" data-id="${i}"${m.saved?' disabled':''}>${m.saved?'Saved ✓':'★ Save'}</button></div></div>`:''}</div>`).join('');
  const r=G(),t=tot();
  $('#chips').innerHTML=[
    'Whole box of Kraft mac and cheese',
    '4 slices of medium pepperoni pizza from Papa Johns',
    '2 McDonalds McDoubles and medium fries',
    'Compare Whole Milk vs 2% vs Fairlife Milk'
  ].map(x=>`<button data-a="chip">${esc(x)}</button>`).join('');
  $('#pv').innerHTML=pend?`<div class="mu" style="padding:6px 0"><img src="${pend.url}" alt="" style="height:44px;border-radius:8px;vertical-align:middle"> Photo attached <button class="ib" id="rm" aria-label="Remove">✕</button></div>`:'';
  const rm=$('#rm');if(rm)rm.onclick=()=>{pend=null;rChat()};
  $('#msgs').scrollTop=1e9;
}

$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const i=new Image();
  i.onload=()=>{
    const s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=i.width*s;c.height=i.height*s;
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',.82);
    pend={base64:url.split(',')[1],url};
    rChat();
  };
  i.src=URL.createObjectURL(f);e.target.value='';
};

$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function send(){
  if(busy)return;
  const inp=$('#inp');let text=inp.value.trim();
  if(!text&&!pend)return;
  if(!text)text='Estimate the calories and macros of this meal.';
  const img=pend;pend=null;inp.value='';
  S.chat.push({r:'u',t:text,img:img&&img.url});
  const a={r:'a',t:'',wait:1};S.chat.push(a);busy=true;rChat();

  setTimeout(async()=>{
    let reply=generateLocalCoachResponse(text,img);
    const q=text.toLowerCase().trim();
    const looksLikeFoodQuery=!img&&!reply.meal&&!(/^(hi|hello|hey|yo|sup|how are you|what can you do|help|thanks|thank you)/i.test(q))&&
      (/(ate|had|log|calories|macros|protein|carbs|box|bag|bottle|can|bar|slice|cup|bowl|oz|grams|burger|pizza|sandwich|shake|milk|cheese|chicken|beef)/i.test(q) || q.split(/\s+/).length<=6);

    if(looksLikeFoodQuery){
      const offItem=await searchOpenFoodFactsText(text);
      if(offItem&&offItem.cal>0){
        const g=G(),t=tot();
        const remCal=Math.max(0,g.cal-t.cal-offItem.cal),remP=Math.max(0,g.p-t.p-offItem.p);
        reply={
          text:`🌐 **Found in Open Food Facts Database (${offItem.name}):**\n• **Serving Reference:** ${offItem.serving}\n• **Macros:** **${offItem.cal} kcal** (${offItem.p}g Protein · ${offItem.c}g Carbs · ${offItem.f}g Fat)\n\nLogging this leaves you with **${remCal.toLocaleString()} kcal** and **${remP}g protein** for today. Tap **Log Meal** below!`,
          meal:{name:offItem.name,cal:offItem.cal,p:offItem.p,c:offItem.c,f:offItem.f}
        };
      }
    }

    a.t=reply.text;
    if(reply.meal)a.meal=reply.meal;
    delete a.wait;busy=false;save();rChat();
  },180);
}

upd();rWork();rWeigh();const h=location.hash.slice(1);tab(T.some(t=>t[0]===h)?h:'home');if(S.act)openW();
