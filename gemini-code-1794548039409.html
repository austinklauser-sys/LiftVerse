<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BarBite</title>
<style>
:root{color-scheme:dark;--bg:#09090B;--card:#18181B;--c2:#27272A;--bd:#2f2f36;--tx:#FAFAFA;--mu:#8e8e99;--ac:#3B82F6;--a2:#60A5FA;--a3:#93C5FD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font-family:inherit}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
section{display:none;animation:fi .25s ease}section.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--mu);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--a2)}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:22px 0 10px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.ring{position:relative;width:200px;height:200px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.big{font-size:40px;font-weight:800;line-height:1}
.bar{margin:12px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .tr{height:8px;background:var(--c2);border-radius:6px;overflow:hidden}.bar .fl{height:100%;border-radius:6px;transition:width .5s}
.meal{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.meal:last-child{border:0}
.meal .i{flex:1;min-width:0}.meal b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mac{font-size:12px;color:var(--mu)}.mac i{font-style:normal;font-weight:700}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:0;background:var(--c2);color:var(--tx);font-size:16px}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:700;width:100%;margin-top:4px}
.btn.s{background:var(--c2)}.btn.sm{width:auto;min-height:44px;padding:0 14px;font-size:14px;margin:0}.btn:disabled{opacity:.5}
.btn.dng{background:#3a181d;color:#fca5a5;border:1px solid #6b2630}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:0 12px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{background:#1e2a44;border:1px solid #2d4a85;color:var(--a3);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.stat div{background:var(--c2);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.fab{position:absolute;right:16px;bottom:76px;width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px #0009}
#chat{display:none;flex-direction:column;height:100%}#chat.on{display:flex}#msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.m.u{background:var(--ac);margin-left:auto;border-bottom-right-radius:4px}.m.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.mc{margin-top:10px;background:var(--c2);border-radius:12px;padding:10px;white-space:normal}.mc .r{display:flex;gap:8px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.chips button{flex:none;min-height:40px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 14px;font-size:14px}
.row{display:flex;gap:8px;align-items:flex-end;padding-top:6px}.row textarea{min-height:48px;max-height:110px;padding:12px;resize:none}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:12}
.sheet>div{background:var(--card);width:100%;max-width:430px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.dot{display:inline-block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.mh b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{font-size:11px;color:var(--mu)}
.cd{aspect-ratio:1;min-height:40px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx);font-size:14px}
.cd.w{background:var(--ac);font-weight:700}.cd.t{border-color:var(--a2)}.cd.s{outline:2px solid var(--a3)}
.pr{display:inline-block;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:10px}
